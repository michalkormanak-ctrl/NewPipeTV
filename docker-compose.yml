services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: legis
      POSTGRES_PASSWORD: legis
      POSTGRES_DB: legis
    ports:
      - "5432:5432"
    volumes:
      - legis_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U legis"]
      interval: 5s
      timeout: 5s
      retries: 10

  opensearch:
    image: opensearchproject/opensearch:2.16.0
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
    ports:
      - "9200:9200"

  api:
    build: ./backend
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql+psycopg://legis:legis@db:5432/legis
      OPENSEARCH_URL: http://opensearch:9200
    ports:
      - "8000:8000"

volumes:
  legis_pgdata:
